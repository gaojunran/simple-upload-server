[package]
name = "upload-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
zip = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"